name: maheba

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maheba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maheba}
      POSTGRES_DB: ${POSTGRES_DB:-maheba}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume = data survives restarts, rebuilds, and `docker compose down`.
      # Only `docker compose down -v` deletes it (then seed runs again on next up).
      - pgdata:/var/lib/postgresql/data
      # First-time init: schema then seed. Runs ONLY when pgdata is empty.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-maheba}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
